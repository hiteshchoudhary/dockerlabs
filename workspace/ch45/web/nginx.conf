# One front door (Chapter 28): serve the static site, proxy /api to the api
# service by its compose DNS name. The api itself is never published to the
# host — this proxy is the only way in.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }
}
